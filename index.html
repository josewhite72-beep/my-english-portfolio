<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My English Portfolio</title>
<meta name="theme-color" content="#3E3373">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --indigo:#3E3373; --violet:#6E5CC4; --sky:#6FA8F5;
    --ink:#211B3D; --ink-soft:#4A4468; --paper:#FBFAFF;
    --card-bg:rgba(255,255,255,.94); --card-bg-hover:rgba(255,255,255,1);
    --line:rgba(33,27,61,.09); --shadow:0 10px 30px rgba(33,20,80,.18);
    --radius:18px; --tab-I:#FF8E72; --tab-II:#2BC9A6; --tab-III:#FFC145;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:var(--ink); min-height:100vh;
    background:radial-gradient(circle at 8% 12%, rgba(255,255,255,.10), transparent 40%),
      linear-gradient(135deg, var(--indigo) 0%, var(--violet) 52%, var(--sky) 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}
  .app{display:flex; min-height:100vh;}
  .spine{width:64px; flex:0 0 64px; display:flex; flex-direction:column; align-items:center; padding-top:28px; gap:14px; position:sticky; top:0; height:100vh;}
  .tab{writing-mode:vertical-rl; text-orientation:mixed; border:none; cursor:pointer; padding:18px 8px; border-radius:0 12px 12px 0;
    font-family:'Fraunces',serif; font-weight:600; font-size:.82rem; letter-spacing:.04em; color:var(--ink);
    background:rgba(255,255,255,.55); box-shadow:0 4px 12px rgba(20,10,50,.15);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease; transform:translateX(-6px);}
  .tab:hover{transform:translateX(0);}
  .tab.active{transform:translateX(0); box-shadow:0 6px 18px rgba(20,10,50,.32); color:#1a1430;}
  .tab[data-trimester="I"]{background:rgba(255,142,114,.55);} .tab[data-trimester="I"].active{background:var(--tab-I);}
  .tab[data-trimester="II"]{background:rgba(43,201,166,.55);} .tab[data-trimester="II"].active{background:var(--tab-II);}
  .tab[data-trimester="III"]{background:rgba(255,193,69,.55);} .tab[data-trimester="III"].active{background:var(--tab-III);}
  main{flex:1; padding:28px 32px 100px; min-width:0;}
  header.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px;}
  .brand{display:flex; flex-direction:column; gap:4px;}
  .brand .kicker{color:rgba(255,255,255,.85); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; font-weight:700;}
  .brand h1{color:#fff; font-size:1.9rem; text-shadow:0 4px 18px rgba(20,10,60,.35);}
  .storage-pill{font-size:.72rem; color:rgba(255,255,255,.85); background:rgba(255,255,255,.14); padding:5px 12px; border-radius:100px; width:fit-content; margin-top:2px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .toolbar input[type="search"]{padding:11px 14px; border-radius:100px; border:none; min-width:230px; background:rgba(255,255,255,.92); font-family:inherit; font-size:.88rem; color:var(--ink);}
  .icon-btn{border:none; background:rgba(255,255,255,.2); color:#fff; padding:10px 14px; border-radius:100px; cursor:pointer; font-size:.82rem; font-weight:600;}
  .icon-btn:hover{background:rgba(255,255,255,.32);}
  .breadcrumb{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:20px;}
  .crumb{background:rgba(255,255,255,.16); color:#fff; border:none; padding:7px 14px; border-radius:100px; font-size:.8rem; font-weight:600; cursor:pointer; font-family:inherit;}
  .crumb:hover{background:rgba(255,255,255,.3);}
  .crumb.current{background:rgba(255,255,255,.92); color:var(--ink);}
  .crumb-sep{color:rgba(255,255,255,.6); font-size:.8rem;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px;}
  .gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px;}
  .folder-card{background:var(--card-bg); border-radius:16px; padding:20px 16px; cursor:pointer; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:8px; transition:transform .16s ease, box-shadow .16s ease; position:relative;}
  .folder-card:hover{transform:translateY(-4px); background:var(--card-bg-hover);}
  .folder-icon{font-size:1.6rem;}
  .folder-card h3{font-size:1rem; line-height:1.25;}
  .folder-count{font-size:.74rem; color:var(--ink-soft);}
  .folder-del{position:absolute; top:8px; right:8px; background:none; border:none; color:var(--ink-soft); opacity:.5; font-size:.9rem; cursor:pointer; padding:4px;}
  .folder-del:hover{opacity:1; color:#e5484d;}
  .add-card{background:rgba(255,255,255,.22); border:2px dashed rgba(255,255,255,.55); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; border-radius:16px; cursor:pointer; min-height:96px; font-weight:700;}
  .add-card:hover{background:rgba(255,255,255,.32);}
  .add-card .plus{font-size:1.6rem;}
  .card{background:var(--card-bg); border-radius:var(--radius); padding:0; box-shadow:var(--shadow); cursor:pointer; overflow:hidden;
    transition:transform .16s ease, box-shadow .16s ease; display:flex; flex-direction:column;}
  .card:hover{transform:translateY(-4px); background:var(--card-bg-hover);}
  .card-accent{height:8px; width:100%;}
  .card-body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .filename{font-size:.72rem; color:var(--ink-soft); opacity:.75; margin-top:auto; display:flex; align-items:center; gap:6px; padding-top:6px; border-top:1px dashed var(--line);}
  .empty-state{grid-column:1/-1; text-align:center; padding:60px 20px; color:rgba(255,255,255,.92);}
  .empty-state h2{font-size:1.4rem; margin-bottom:8px;}
  .empty-state p{opacity:.85; max-width:420px; margin:0 auto;}
  .fab{position:fixed; right:28px; bottom:28px; width:60px; height:60px; border-radius:50%; border:none;
    background:linear-gradient(135deg,var(--tab-I),var(--tab-III)); color:#2a1a0f; font-size:1.7rem; font-weight:700; cursor:pointer;
    box-shadow:0 12px 26px rgba(20,10,60,.4); z-index:20; transition:transform .15s ease;}
  .fab:hover{transform:scale(1.06) rotate(90deg);}
  .modal-overlay{position:fixed; inset:0; background:rgba(20,12,45,.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-overlay.hidden{display:none;}
  .modal{background:var(--paper); border-radius:22px; max-width:480px; width:100%; max-height:88vh; overflow-y:auto; padding:26px 26px 22px; box-shadow:0 30px 60px rgba(0,0,0,.35);}
  .modal h2{font-size:1.3rem; margin-bottom:4px;}
  .modal .sub{font-size:.82rem; color:var(--ink-soft); margin-bottom:16px;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:.76rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field textarea{padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); font-family:inherit; font-size:.9rem; background:#fff; color:var(--ink);}
  .field textarea{resize:vertical; min-height:60px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:8px;}
  .btn{border:none; padding:11px 20px; border-radius:100px; font-family:inherit; font-weight:700; font-size:.85rem; cursor:pointer;}
  .btn-primary{background:var(--indigo); color:#fff;} .btn-primary:hover{background:#2c2456;}
  .btn-ghost{background:transparent; color:var(--ink-soft);}
  .btn-danger{background:#e5484d; color:#fff;}
  .file-row{display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:8px;}
  .file-row .fico{font-size:1.3rem;}
  .file-row input{flex:1; border:none; font-family:inherit; font-size:.86rem; padding:4px; background:transparent;}
  .detail-file{background:#fff; border:1.5px dashed var(--line); border-radius:14px; padding:16px; display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .detail-file .fico{font-size:1.8rem;}
  .preview-frame{width:100%; height:420px; border:1.5px solid var(--line); border-radius:12px; background:#fff;}
  .preview-docx{max-height:420px; overflow-y:auto; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:16px; font-size:.86rem; line-height:1.6; color:var(--ink);}
  .preview-docx img{max-width:100%;}
  .preview-msg{font-size:.82rem; color:var(--ink-soft); background:#fff; border:1.5px dashed var(--line); border-radius:12px; padding:16px; text-align:center;}
  .preview-pdf{max-height:420px; overflow-y:auto; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:8px;}
  .preview-pdf canvas{width:100%; height:auto; display:block; margin-bottom:8px;}
  .toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--indigo); color:#fff; padding:11px 22px; border-radius:100px;
    font-size:.85rem; font-weight:600; box-shadow:0 10px 26px rgba(0,0,0,.3); z-index:80; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  @media (max-width:640px){ main{padding:20px 14px 100px;} .spine{width:48px; flex:0 0 48px;} .brand h1{font-size:1.4rem;} }
</style>
</head>
<body>
<div class="app">
  <aside class="spine" id="spine">
    <button class="tab active" data-trimester="I">Trimestre&nbsp;I</button>
    <button class="tab" data-trimester="II">Trimestre&nbsp;II</button>
    <button class="tab" data-trimester="III">Trimestre&nbsp;III</button>
  </aside>
  <main>
    <header class="top">
      <div class="brand">
        <span class="kicker">PanaMentorLabs</span>
        <h1>My English Portfolio</h1>
        <span class="storage-pill" id="storagePill">Calculando espacio usado…</span>
      </div>
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Buscar en todo el portafolio…">
        <button class="icon-btn" id="clearCacheBtn" title="Limpiar caché de la app">🗑 Caché</button>
      </div>
    </header>
    <div class="breadcrumb" id="breadcrumb"></div>
    <section id="content"></section>
  </main>
  <button class="fab" id="fabBtn" title="Agregar">+</button>
</div>

<div class="modal-overlay hidden" id="folderModal">
  <div class="modal">
    <h2>Nuevo Scenario / Theme</h2>
    <div class="sub">Crea la carpeta donde vas a subir materiales de este grado.</div>
    <form id="folderForm">
      <div class="field"><label>Scenario</label><input type="text" id="ff_scenario" required placeholder="Ej. My Family"></div>
      <div class="field"><label>Theme</label><input type="text" id="ff_theme" required placeholder="Ej. Family Members"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="folderCancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Crear</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay hidden" id="typeModal">
  <div class="modal">
    <h2>Nuevo Type</h2>
    <div class="sub">Agrega una subcarpeta de tipo personalizada.</div>
    <form id="typeForm">
      <div class="field"><label>Nombre del Type</label><input type="text" id="tf_name" required placeholder="Ej. Quizzes"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="typeCancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Crear</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay hidden" id="uploadModal">
  <div class="modal">
    <h2>Subir materiales</h2>
    <div class="sub" id="uploadContext"></div>
    <input type="file" id="uf_files" multiple style="margin-bottom:14px;">
    <div id="uploadRows"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="uploadCancel">Cancelar</button>
      <button type="button" class="btn btn-primary" id="uploadSave">Guardar todos</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="detailModal">
  <div class="modal">
    <h2 id="detailTitleText"></h2>
    <div class="sub" id="detailDateText"></div>
    <div class="detail-file">
      <span class="fico" id="detailFileIcon">📄</span>
      <div><div style="font-weight:700;" id="detailFileName"></div><div class="sub" style="margin:0;" id="detailFileSize"></div></div>
    </div>
    <div id="previewWrap" style="margin-bottom:16px;"></div>
    <div class="field"><label>Título</label><input type="text" id="d_titleEdit"></div>
    <div class="field"><label>Notas</label><textarea id="d_notesEdit" placeholder="Notas rápidas…"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="detailDelete">Eliminar</button>
      <button class="btn btn-ghost" id="detailSaveEdit">Guardar cambios</button>
      <button class="btn btn-primary" id="detailDownload">Descargar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- IndexedDB layer ---------------- */
const DB_NAME='myEnglishPortfolioDB', DB_VERSION=2;
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded=e=>{
      const _db=e.target.result;
      if(!_db.objectStoreNames.contains('materials')){
        const s=_db.createObjectStore('materials',{keyPath:'id',autoIncrement:true});
        s.createIndex('trimester','trimester');
      }
      if(!_db.objectStoreNames.contains('folders')){
        _db.createObjectStore('folders',{keyPath:'id',autoIncrement:true});
      }
      if(!_db.objectStoreNames.contains('meta')){
        _db.createObjectStore('meta',{keyPath:'key'});
      }
    };
    req.onsuccess=e=>{db=e.target.result; resolve(db);};
    req.onerror=e=>reject(e);
  });
}
function store(name,mode='readonly'){ return db.transaction(name,mode).objectStore(name); }
function idbAdd(name,data){ return new Promise((res,rej)=>{ const r=store(name,'readwrite').add(data); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e); }); }
function idbPut(name,data){ return new Promise((res,rej)=>{ const r=store(name,'readwrite').put(data); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e); }); }
function idbDelete(name,id){ return new Promise((res,rej)=>{ const r=store(name,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=e=>rej(e); }); }
function idbGetAll(name){ return new Promise((res,rej)=>{ const r=store(name).getAll(); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e); }); }
function idbGet(name,id){ return new Promise((res,rej)=>{ const r=store(name).get(id); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e); }); }

/* ---------------- state ---------------- */
const GRADES=['PreK','Kinder','1°','2°','3°','4°','5°','6°'];
const FIXED_TYPES=['Lesson Planners','Class Development','Class Assessment','Otros'];
let materials=[], folders=[], customTypes=[];
let state={trimester:'I', grade:null, folderId:null, type:null};
let detailId=null;

const THEME_COLORS=['#FF8E72','#FFC145','#2BC9A6','#EF476F','#5B8DEF','#B892FF','#4CC9F0','#8AC926'];
const TYPE_ICONS={'Lesson Planners':'📘','Class Development':'🧑‍🏫','Class Assessment':'✅','Otros':'📄'};
function colorFor(str){ if(!str) return THEME_COLORS[0]; let h=0; for(let i=0;i<str.length;i++){h=str.charCodeAt(i)+((h<<5)-h);} return THEME_COLORS[Math.abs(h)%THEME_COLORS.length]; }
function fileIconFor(name=''){ const ext=name.split('.').pop().toLowerCase();
  if(ext==='pdf') return '📕'; if(['docx','doc'].includes(ext)) return '📄'; if(['pptx','ppt'].includes(ext)) return '🖥️';
  if(['xlsx','xls','csv'].includes(ext)) return '📊'; if(['png','jpg','jpeg','gif','webp','svg'].includes(ext)) return '🖼️';
  if(ext==='html') return '🌐'; return '📎'; }
function fmtBytes(b){ if(!b) return '0 KB'; const kb=b/1024; return kb<1024? kb.toFixed(0)+' KB' : (kb/1024).toFixed(1)+' MB'; }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('es-PA',{day:'2-digit',month:'short',year:'numeric'}); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function escapeHtml(s=''){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- data helpers ---------------- */
function foldersFor(trimester,grade){ return folders.filter(f=>f.trimester===trimester && f.grade===grade); }
function materialsFor(filter){ return materials.filter(m=>Object.keys(filter).every(k=>m[k]===filter[k])); }
function allTypes(){ return [...FIXED_TYPES, ...customTypes]; }

/* ---------------- breadcrumb ---------------- */
function renderBreadcrumb(){
  const el=document.getElementById('breadcrumb');
  let html=`<button class="crumb ${!state.grade?'current':''}" data-lvl="0">Trimestre ${state.trimester}</button>`;
  if(state.grade){
    html+=`<span class="crumb-sep">›</span><button class="crumb ${!state.folderId?'current':''}" data-lvl="1">${state.grade}</button>`;
  }
  if(state.folderId){
    const f=folders.find(x=>x.id===state.folderId);
    html+=`<span class="crumb-sep">›</span><button class="crumb ${!state.type?'current':''}" data-lvl="2">${escapeHtml(f? f.scenario+' / '+f.theme : '')}</button>`;
  }
  if(state.type){
    html+=`<span class="crumb-sep">›</span><button class="crumb current" data-lvl="3">${escapeHtml(state.type)}</button>`;
  }
  el.innerHTML=html;
  el.querySelectorAll('.crumb').forEach(btn=>btn.addEventListener('click',()=>{
    const lvl=Number(btn.dataset.lvl);
    if(lvl===0){ state.grade=null; state.folderId=null; state.type=null; }
    else if(lvl===1){ state.folderId=null; state.type=null; }
    else if(lvl===2){ state.type=null; }
    renderAll();
  }));
}

/* ---------------- content rendering ---------------- */
function renderContent(){
  const el=document.getElementById('content');
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  if(q){ renderSearchResults(el,q); return; }
  if(!state.grade){ renderGradeGrid(el); }
  else if(!state.folderId){ renderFolderGrid(el); }
  else if(!state.type){ renderTypeGrid(el); }
  else { renderMaterialsList(el); }
}

function renderGradeGrid(el){
  el.innerHTML=`<div class="grid">${GRADES.map(g=>{
    const count=materials.filter(m=>m.trimester===state.trimester && m.grade===g).length;
    return `<div class="folder-card" data-grade="${g}"><span class="folder-icon">🗂️</span><h3>${g}</h3><span class="folder-count">${count} material${count===1?'':'es'}</span></div>`;
  }).join('')}</div>`;
  el.querySelectorAll('.folder-card').forEach(c=>c.addEventListener('click',()=>{ state.grade=c.dataset.grade; renderAll(); }));
}

function renderFolderGrid(el){
  const list=foldersFor(state.trimester,state.grade);
  let html=`<div class="grid">`;
  html+=list.map(f=>{
    const count=materials.filter(m=>m.trimester===state.trimester && m.grade===state.grade && m.scenario===f.scenario && m.theme===f.theme).length;
    return `<div class="folder-card" data-id="${f.id}">
      <button class="folder-del" data-delfolder="${f.id}" title="Eliminar carpeta">✕</button>
      <span class="folder-icon">📁</span><h3>${escapeHtml(f.scenario)}<br>${escapeHtml(f.theme)}</h3>
      <span class="folder-count">${count} material${count===1?'':'es'}</span></div>`;
  }).join('');
  html+=`<div class="add-card" id="addFolderCard"><span class="plus">+</span><span>Nuevo Scenario / Theme</span></div></div>`;
  if(list.length===0){
    el.innerHTML=`<div class="empty-state"><h2>Sin scenarios aún</h2><p>Crea el primero con la tarjeta "+ Nuevo Scenario / Theme".</p></div>`+html;
  } else { el.innerHTML=html; }
  el.querySelectorAll('.folder-card').forEach(c=>c.addEventListener('click',e=>{
    if(e.target.closest('.folder-del')) return;
    state.folderId=Number(c.dataset.id); renderAll();
  }));
  el.querySelectorAll('[data-delfolder]').forEach(btn=>btn.addEventListener('click',async e=>{
    e.stopPropagation();
    const id=Number(btn.dataset.delfolder);
    const f=folders.find(x=>x.id===id);
    if(!confirm(`¿Eliminar la carpeta "${f.scenario} / ${f.theme}" y todos sus materiales?`)) return;
    const toDelete=materials.filter(m=>m.trimester===f.trimester && m.grade===f.grade && m.scenario===f.scenario && m.theme===f.theme);
    for(const m of toDelete) await idbDelete('materials',m.id);
    await idbDelete('folders',id);
    showToast('Carpeta eliminada');
    await refresh();
  }));
  document.getElementById('addFolderCard')?.addEventListener('click',()=>{ document.getElementById('folderModal').classList.remove('hidden'); });
}

function renderTypeGrid(el){
  const f=folders.find(x=>x.id===state.folderId);
  let html=`<div class="grid">`;
  html+=allTypes().map(t=>{
    const count=materials.filter(m=>m.trimester===state.trimester && m.grade===state.grade && m.scenario===f.scenario && m.theme===f.theme && m.type===t).length;
    return `<div class="folder-card" data-type="${escapeHtml(t)}"><span class="folder-icon">${TYPE_ICONS[t]||'📦'}</span><h3>${escapeHtml(t)}</h3><span class="folder-count">${count} material${count===1?'':'es'}</span></div>`;
  }).join('');
  html+=`<div class="add-card" id="addTypeCard"><span class="plus">+</span><span>Nuevo Type</span></div></div>`;
  el.innerHTML=html;
  el.querySelectorAll('.folder-card').forEach(c=>c.addEventListener('click',()=>{ state.type=c.dataset.type; renderAll(); }));
  document.getElementById('addTypeCard')?.addEventListener('click',()=>{ document.getElementById('typeModal').classList.remove('hidden'); });
}

function renderMaterialsList(el){
  const f=folders.find(x=>x.id===state.folderId);
  const list=materialsFor({trimester:state.trimester, grade:state.grade, type:state.type,
    scenario:f?.scenario, theme:f?.theme}).sort((a,b)=>b.dateAdded-a.dateAdded);
  if(list.length===0){
    el.innerHTML=`<div class="empty-state"><h2>Aún no hay materiales aquí</h2><p>Usa el botón + para subir archivos a esta carpeta.</p></div>`;
    return;
  }
  el.innerHTML=`<div class="gallery">${list.map(m=>{
    const color=colorFor(m.theme||m.type);
    return `<div class="card" data-id="${m.id}"><div class="card-accent" style="background:${color};"></div>
      <div class="card-body"><h3>${escapeHtml(m.title)}</h3>
      <div class="filename">${fileIconFor(m.fileName)} ${escapeHtml(m.fileName||'sin archivo')} · ${fmtDate(m.dateAdded)}</div></div></div>`;
  }).join('')}</div>`;
  el.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openDetail(Number(c.dataset.id))));
}

function renderSearchResults(el,q){
  const list=materials.filter(m=>(m.title+' '+m.scenario+' '+m.theme).toLowerCase().includes(q)).sort((a,b)=>b.dateAdded-a.dateAdded);
  if(list.length===0){ el.innerHTML=`<div class="empty-state"><h2>Sin resultados</h2><p>Prueba con otro término de búsqueda.</p></div>`; return; }
  el.innerHTML=`<div class="gallery">${list.map(m=>{
    const color=colorFor(m.theme||m.type);
    return `<div class="card" data-id="${m.id}"><div class="card-accent" style="background:${color};"></div>
      <div class="card-body"><h3>${escapeHtml(m.title)}</h3>
      <div class="filename" style="border-top:none; padding-top:0; opacity:.9;">T${m.trimester} · ${m.grade} · ${escapeHtml(m.scenario)} / ${escapeHtml(m.theme)} · ${escapeHtml(m.type)}</div>
      <div class="filename">${fileIconFor(m.fileName)} ${escapeHtml(m.fileName||'')} · ${fmtDate(m.dateAdded)}</div></div></div>`;
  }).join('')}</div>`;
  el.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openDetail(Number(c.dataset.id))));
}

function renderFab(){
  const fab=document.getElementById('fabBtn');
  if(!state.grade){ fab.style.display='none'; }
  else if(!state.folderId){ fab.style.display='none'; }
  else { fab.style.display='flex'; }
}

function renderAll(){ renderBreadcrumb(); renderContent(); renderFab(); updateStoragePill(); }

/* ---------------- fab click dispatch ---------------- */
document.getElementById('fabBtn').addEventListener('click',()=>{
  if(state.folderId && !state.type){ document.getElementById('typeModal').classList.remove('hidden'); }
  else if(state.type){ openUploadModal(); }
});

/* ---------------- folder create ---------------- */
document.getElementById('folderCancel').addEventListener('click',()=>document.getElementById('folderModal').classList.add('hidden'));
document.getElementById('folderForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const scenario=document.getElementById('ff_scenario').value.trim();
  const theme=document.getElementById('ff_theme').value.trim();
  const id=await idbAdd('folders',{trimester:state.trimester, grade:state.grade, scenario, theme, dateCreated:Date.now()});
  document.getElementById('folderModal').classList.add('hidden');
  document.getElementById('ff_scenario').value=''; document.getElementById('ff_theme').value='';
  await refresh();
  state.folderId=id; renderAll();
  showToast('Carpeta creada');
});

/* ---------------- type create ---------------- */
document.getElementById('typeCancel').addEventListener('click',()=>document.getElementById('typeModal').classList.add('hidden'));
document.getElementById('typeForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const name=document.getElementById('tf_name').value.trim();
  if(name && !allTypes().includes(name)){
    customTypes.push(name);
    await idbPut('meta',{key:'customTypes', value:customTypes});
  }
  document.getElementById('typeModal').classList.add('hidden');
  document.getElementById('tf_name').value='';
  state.type=name; renderAll();
  showToast('Type creado');
});

/* ---------------- upload flow ---------------- */
function openUploadModal(){
  const f=folders.find(x=>x.id===state.folderId);
  document.getElementById('uploadContext').textContent=`Trimestre ${state.trimester} · ${state.grade} · ${f.scenario} / ${f.theme} · ${state.type}`;
  document.getElementById('uf_files').value='';
  document.getElementById('uploadRows').innerHTML='';
  document.getElementById('uploadModal').classList.remove('hidden');
}
document.getElementById('uploadCancel').addEventListener('click',()=>document.getElementById('uploadModal').classList.add('hidden'));
document.getElementById('uf_files').addEventListener('change', e=>{
  const rows=document.getElementById('uploadRows');
  rows.innerHTML='';
  [...e.target.files].forEach((file,idx)=>{
    const base=file.name.replace(/\.[^/.]+$/,'');
    const row=document.createElement('div');
    row.className='file-row';
    row.innerHTML=`<span class="fico">${fileIconFor(file.name)}</span><input type="text" data-idx="${idx}" value="${escapeHtml(base)}">`;
    rows.appendChild(row);
  });
});
document.getElementById('uploadSave').addEventListener('click', async ()=>{
  const fileInput=document.getElementById('uf_files');
  const files=[...fileInput.files];
  if(files.length===0){ document.getElementById('uploadModal').classList.add('hidden'); return; }
  const titleInputs=document.querySelectorAll('#uploadRows input');
  const f=folders.find(x=>x.id===state.folderId);
  for(let i=0;i<files.length;i++){
    await idbAdd('materials',{
      trimester:state.trimester, grade:state.grade, scenario:f.scenario, theme:f.theme, type:state.type,
      title:titleInputs[i].value.trim()||files[i].name, fileBlob:files[i], fileName:files[i].name, fileType:files[i].type,
      dateAdded:Date.now(), notes:''
    });
  }
  document.getElementById('uploadModal').classList.add('hidden');
  showToast(`${files.length} material(es) guardado(s)`);
  await refresh(); renderAll();
});

/* ---------------- detail modal ---------------- */
async function openDetail(id){
  const m=await idbGet('materials',id);
  if(!m) return;
  detailId=id;
  document.getElementById('detailTitleText').textContent=m.title;
  document.getElementById('detailDateText').textContent=`Trimestre ${m.trimester} · ${m.grade} · ${m.scenario} / ${m.theme} · ${m.type} · ${fmtDate(m.dateAdded)}`;
  document.getElementById('detailFileIcon').textContent=fileIconFor(m.fileName);
  document.getElementById('detailFileName').textContent=m.fileName||'—';
  document.getElementById('detailFileSize').textContent=m.fileBlob? fmtBytes(m.fileBlob.size):'';
  document.getElementById('d_titleEdit').value=m.title;
  document.getElementById('d_notesEdit').value=m.notes||'';
  await renderPreview(m);
  document.getElementById('detailModal').classList.remove('hidden');
}
let currentPreviewUrl=null;
async function renderPreview(m){
  const wrap=document.getElementById('previewWrap');
  if(currentPreviewUrl){ URL.revokeObjectURL(currentPreviewUrl); currentPreviewUrl=null; }
  wrap.innerHTML='<div class="preview-msg">Cargando vista previa…</div>';
  const ext=(m.fileName||'').split('.').pop().toLowerCase();
  if(!m.fileBlob){ wrap.innerHTML='<div class="preview-msg">Sin archivo adjunto.</div>'; return; }
  try{
    if(ext==='pdf'){
      if(typeof pdfjsLib==='undefined'){
        wrap.innerHTML='<div class="preview-msg">No se pudo cargar el visor de PDF (sin conexión). Usa Descargar.</div>';
      } else {
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const arrayBuffer=await m.fileBlob.arrayBuffer();
        const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
        const holder=document.createElement('div');
        holder.className='preview-pdf';
        wrap.innerHTML=''; wrap.appendChild(holder);
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i);
          const viewport=page.getViewport({scale:1.3});
          const canvas=document.createElement('canvas');
          canvas.width=viewport.width; canvas.height=viewport.height;
          await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
          holder.appendChild(canvas);
        }
      }
    } else if(ext==='html' || ext==='htm'){
      currentPreviewUrl=URL.createObjectURL(m.fileBlob);
      wrap.innerHTML=`<iframe class="preview-frame" src="${currentPreviewUrl}" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>`;
    } else if(ext==='docx'){
      if(typeof mammoth==='undefined'){
        wrap.innerHTML='<div class="preview-msg">No se pudo cargar el conversor de Word (sin conexión). Usa Descargar.</div>';
      } else {
        const arrayBuffer=await m.fileBlob.arrayBuffer();
        const result=await mammoth.convertToHtml({arrayBuffer});
        wrap.innerHTML=`<div class="preview-docx">${result.value}</div>`;
      }
    } else {
      wrap.innerHTML='<div class="preview-msg">Vista previa no disponible para este tipo de archivo. Usa Descargar.</div>';
    }
  } catch(err){
    wrap.innerHTML='<div class="preview-msg">No se pudo generar la vista previa. Usa Descargar.</div>';
  }
}
document.getElementById('detailDownload').addEventListener('click', async ()=>{
  const m=await idbGet('materials',detailId);
  if(!m || !m.fileBlob) return;
  const url=URL.createObjectURL(m.fileBlob);
  const a=document.createElement('a'); a.href=url; a.download=m.fileName||'material';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
});
document.getElementById('detailSaveEdit').addEventListener('click', async ()=>{
  const m=await idbGet('materials',detailId);
  m.title=document.getElementById('d_titleEdit').value.trim()||m.title;
  m.notes=document.getElementById('d_notesEdit').value.trim();
  await idbPut('materials',m);
  document.getElementById('detailModal').classList.add('hidden');
  showToast('Cambios guardados');
  await refresh(); renderAll();
});
document.getElementById('detailDelete').addEventListener('click', async ()=>{
  if(!confirm('¿Eliminar este material? Esta acción no se puede deshacer.')) return;
  await idbDelete('materials',detailId);
  document.getElementById('detailModal').classList.add('hidden');
  showToast('Material eliminado');
  await refresh(); renderAll();
});
document.querySelectorAll('.modal-overlay').forEach(ov=>ov.addEventListener('click', e=>{
  if(e.target===ov){
    ov.classList.add('hidden');
    if(ov.id==='detailModal' && currentPreviewUrl){ URL.revokeObjectURL(currentPreviewUrl); currentPreviewUrl=null; }
  }
}));

/* ---------------- spine tabs ---------------- */
document.getElementById('spine').addEventListener('click', e=>{
  const btn=e.target.closest('.tab');
  if(!btn) return;
  state.trimester=btn.dataset.trimester; state.grade=null; state.folderId=null; state.type=null;
  [...document.querySelectorAll('.tab')].forEach(t=>t.classList.toggle('active', t===btn));
  renderAll();
});
document.getElementById('searchInput').addEventListener('input', renderAll);

/* ---------------- storage pill / cache ---------------- */
async function updateStoragePill(){
  const pill=document.getElementById('storagePill');
  if(navigator.storage && navigator.storage.estimate){
    const est=await navigator.storage.estimate();
    pill.textContent=`${materials.length} materiales · ${fmtBytes(est.usage)} usados en este dispositivo`;
  } else { pill.textContent=`${materials.length} materiales guardados`; }
}
document.getElementById('clearCacheBtn').addEventListener('click', async ()=>{
  if(!confirm('Esto limpia la caché de la app (no borra tus materiales guardados). ¿Continuar?')) return;
  if('caches' in window){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
  if(navigator.serviceWorker){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); }
  showToast('Caché limpiada. Recargando…');
  setTimeout(()=>location.reload(true),900);
});

/* ---------------- boot ---------------- */
async function refresh(){
  materials=await idbGetAll('materials');
  folders=await idbGetAll('folders');
  const ct=await idbGet('meta','customTypes');
  customTypes=ct? ct.value : [];
}
(async function init(){
  await openDB();
  await refresh();
  renderAll();
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
